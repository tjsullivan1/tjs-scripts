name: Storage Metrics tests

on:
  push:
    paths:
      - 'PowerShell/StorageMetrics/**'
      - '.github/workflows/storagemetrics-tests.yml'
  pull_request:
    paths:
      - 'PowerShell/StorageMetrics/**'
      - '.github/workflows/storagemetrics-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -SkipPublisherCheck -Force -ErrorAction Stop
          Install-Module PSScriptAnalyzer -SkipPublisherCheck -Force
      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop
          Invoke-Pester -Path .\PowerShell\StorageMetrics\tests -Output Detailed -CI
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $issues = Invoke-ScriptAnalyzer -Path PowerShell/StorageMetrics -Recurse -Severity Error,Warning -Settings PowerShell/StorageMetrics/PSScriptAnalyzerSettings.psd1
          if ($issues) {
            $issues | Format-List
            throw "$($issues.Count) ScriptAnalyzer issue(s) found."
          }
